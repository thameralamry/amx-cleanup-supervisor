name: AMX Site 2 Cleanup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Safe connection test, or one cleanup tick after approval"
        required: true
        default: test
        type: choice
        options:
          - test
          - tick
  schedule:
    - cron: "10,25,40,55 * * * *"

permissions:
  contents: read

concurrency:
  group: amx-site2-cleanup
  cancel-in-progress: false

jobs:
  cleanup_tick:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SSH_HOST: ${{ secrets.AMX_SITE2_HOST }}
      SSH_USER: ${{ secrets.AMX_SITE2_USER }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.AMX_SITE2_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.AMX_ATOMIC_KNOWN_HOSTS }}
      REQUESTED_OPERATION: ${{ inputs.operation || 'tick' }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY_B64"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure restricted SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/amx-ssh"
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/amx-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/amx-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/amx-ssh/id_ed25519" "$RUNNER_TEMP/amx-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/amx-ssh/id_ed25519" >/dev/null

      - name: Run restricted test or one resumable tick
        shell: bash
        run: |
          set -euo pipefail

          case "$REQUESTED_OPERATION" in
            test) remote_command=amx-cleanup-test ;;
            tick) remote_command=amx-cleanup-tick ;;
            *) echo "Unsupported operation: $REQUESTED_OPERATION" >&2; exit 2 ;;
          esac

          output_file="$RUNNER_TEMP/amx-ssh/dispatcher-output.txt"
          set +e
          ssh \
            -i "$RUNNER_TEMP/amx-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/amx-ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=40 \
            "$SSH_USER@$SSH_HOST" \
            "SSH_ORIGINAL_COMMAND=$remote_command /srv/htdocs/.amx-cleanup/amx-external-dispatch.sh" \
            | tee "$output_file"
          ssh_status=${PIPESTATUS[0]}
          set -e

          if [[ "$REQUESTED_OPERATION" == "test" ]]; then
            grep -Fxq 'MODE: TEST ONLY; TICK NOT CALLED' "$output_file"
            grep -Fxq 'status=NOT_STARTED' "$output_file"
            grep -Fxq 'runner=INACTIVE' "$output_file"
            grep -Fxq 'DISPATCHER_OK' "$output_file"
          fi

          exit "$ssh_status"
