name: AMX Site 1 Cleanup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Safe connection test, or one cleanup tick after approval"
        required: true
        default: test
        type: choice
        options:
          - test
          - tick
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"

permissions:
  contents: read

concurrency:
  group: amx-bluehost-cleanup
  cancel-in-progress: false

jobs:
  cleanup_tick:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SSH_HOST: ${{ secrets.AMX_SITE1_HOST }}
      SSH_USER: ${{ secrets.AMX_SITE1_USER }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.AMX_SITE1_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.AMX_ATOMIC_KNOWN_HOSTS }}
      REQUESTED_OPERATION: ${{ inputs.operation || 'tick' }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY_B64"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure restricted SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/amx-ssh"
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/amx-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/amx-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/amx-ssh/id_ed25519" "$RUNNER_TEMP/amx-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/amx-ssh/id_ed25519" >/dev/null

      - name: Run safe test or one split cleanup cycle
        shell: bash
        run: |
          set -euo pipefail

          ssh_args=(
            -i "$RUNNER_TEMP/amx-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/amx-ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=40
          )

          run_remote() {
            local remote_command="$1"
            ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" \
              "SSH_ORIGINAL_COMMAND=$remote_command /srv/htdocs/.amx-cleanup/amx-external-dispatch.sh"
          }

          if [[ "$REQUESTED_OPERATION" == "test" ]]; then
            test_output="$RUNNER_TEMP/amx-ssh/test-output.txt"
            run_remote amx-cleanup-test | tee "$test_output"
            grep -Fxq 'MODE: TEST ONLY; PREVIEW AND EXECUTE NOT CALLED' "$test_output"
            grep -Fxq 'DISPATCHER_OK' "$test_output"
            exit 0
          fi
          [[ "$REQUESTED_OPERATION" == "tick" ]] || {
            echo "Unsupported operation: $REQUESTED_OPERATION" >&2
            exit 2
          }

          preview_output="$RUNNER_TEMP/amx-ssh/preview-output.txt"
          set +e
          run_remote amx-cleanup-preview | tee "$preview_output"
          preview_status=${PIPESTATUS[0]}
          set -e
          (( preview_status == 0 )) || exit "$preview_status"

          if grep -Eq '^STATUS: (ALREADY_COMPLETE|NO_MORE_SAFE_PROPERTIES|RETRY_ON_NEXT_SCHEDULE)$' "$preview_output"; then
            exit 0
          fi
          grep -Fxq 'STATUS: PREVIEW_COMPLETE_NO_DELETION' "$preview_output"
          grep -Fxq 'SELECTED PROPERTIES: 1' "$preview_output"
          grep -Fxq 'MISSING DERIVATIVE REFERENCES: 0' "$preview_output"
          grep -Fxq 'DISPATCHER_PREVIEW_OK' "$preview_output"

          execute_output="$RUNNER_TEMP/amx-ssh/execute-output.txt"
          run_remote amx-cleanup-execute | tee "$execute_output"
          grep -Fxq 'STATUS: COMPLETE' "$execute_output"
          grep -Fxq 'PROPERTIES CLEANED: 1' "$execute_output"
          grep -Fxq 'FAILED: 0' "$execute_output"
          grep -Fxq 'DISPATCHER_EXECUTE_OK' "$execute_output"
